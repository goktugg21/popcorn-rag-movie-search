<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Movie Explorer</h1>
        <div id="sections">
            <button class="section-btn" id="ai-search">AI Search</button>
            <button class="section-btn" id="normal-search">Normal Search</button>
            <button class="section-btn" id="trope-search">Trope Search</button>
            <button class="section-btn" id="register">User Registration</button>
            <button class="section-btn" id="login">User Login</button>
            <button class="section-btn" id="logout" style="display:none;">Logout</button>
            <button class="section-btn" id="favourites" style="display:none;">User Favourites</button>
        </div>
        <div id="message"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
